- hosts: center
  tasks:
    - name: 检查 center 目录
      shell: "find /data/ -mindepth 1 -maxdepth 1 -type d -name 'center*' -printf '%f\n'"
      register: center_list
      changed_when: false
      tags:
        - alldo

    - name: 确认至少存在一个 center 实例
      assert:
        that:
          - center_list.stdout_lines | length > 0
        fail_msg: "未在 /data 下发现 center 实例目录"
      tags:
        - alldo

    - name: 分发更新压缩包
      copy:
        src: "{{ playbook_dir }}/../../file/alldo.tar.gz"
        dest: /data/update/alldo.tar.gz
      tags:
        - alldo

    - name: 删除原本的 app 目录
      file:
        path: /data/update/app
        state: absent
      tags:
        - alldo

    - name: 执行解压
      unarchive:
        src: /data/update/alldo.tar.gz
        dest: /data/update/
        remote_src: yes
      tags:
        - alldo

    - name: 动态处理 center 实例
      include_tasks: center.yaml
      loop: "{{ center_list.stdout_lines }}"
      loop_control:
        loop_var: center_item
      tags:
        - alldo
