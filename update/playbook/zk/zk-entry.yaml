- hosts: zk
  tasks:
    - name: 检查 zk 目录
      shell: "find /data/zk -mindepth 1 -maxdepth 1 -type d -regex '.*/zk[0-9]+' -printf '%f\n'"
      register: zk_list
      changed_when: false
      tags:
        - alldo

    - name: 确认至少存在一个 zk 实例
      assert:
        that:
          - zk_list.stdout_lines | length > 0
        fail_msg: "未在 /data/zk 下发现 zk[0-9]+ 实例目录"
      tags:
        - alldo

    - name: 分发alldo.tar.gz压缩包
      copy:
        src: "{{ playbook_dir }}/../../file/alldo.tar.gz"
        dest: /data/update/alldo.tar.gz
      tags:
        - alldo

    - name: 删除原本的 app 目录
      file:
        path: /data/update/app
        state: absent
      tags:
        - alldo

    - name: 执行解压alldo.tar.gz
      unarchive:
        src: /data/update/alldo.tar.gz
        dest: /data/update/
        remote_src: yes
      tags:
        - alldo

    - name: 动态处理 zk 实例
      include_tasks: zk.yaml
      loop: "{{ zk_list.stdout_lines }}"
      loop_control:
        loop_var: zk_item
      tags:
        - alldo
