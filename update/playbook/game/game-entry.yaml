- hosts: game
  tasks:
    - name: 检查 game 目录
      shell: "find /data/ -mindepth 1 -maxdepth 1 -type d -regex '.*/game[0-9]+' -printf '%f\n'"
      register: game_list
      changed_when: false
      tags:
        - groups
        - increment
        - alldo

    - name: 确认至少存在一个 game 实例
      assert:
        that:
          - game_list.stdout_lines | length > 0
        fail_msg: "未在 /data 下发现 game[0-9]+ 实例目录"
      tags:
        - groups
        - increment
        - alldo

    - name: 分发increment.tar.gz压缩包
      copy:
        src: "{{ playbook_dir }}/../../file/increment.tar.gz"
        dest: /data/update/increment.tar.gz
      tags: increment

    - name: 分发alldo.tar.gz压缩包
      copy:
        src: "{{ playbook_dir }}/../../file/alldo.tar.gz"
        dest: /data/update/alldo.tar.gz
      tags: alldo

    - name: 删除原本的 app 目录
      file:
        path: /data/update/app
        state: absent
      tags:
        - increment
        - alldo

    - name: 执行解压increment.tar.gz
      unarchive:
        src: /data/update/increment.tar.gz
        dest: /data/update/
        remote_src: yes
      tags: increment

    - name: 执行解压alldo.tar.gz
      unarchive:
        src: /data/update/alldo.tar.gz
        dest: /data/update/
        remote_src: yes
      tags: alldo

    - name: 动态处理 game 实例
      include_tasks: game.yaml
      loop: "{{ game_list.stdout_lines }}"
      loop_control:
        loop_var: game_item
      tags:
        - groups
        - increment
        - alldo
