- name: 校验安装包存在且非空
  stat:
    path: "{{ role_path }}/files/install.tar.gz"
  delegate_to: localhost
  become: false
  register: install_archive
  failed_when: >
    not (install_archive.stat.exists | default(false)) or
    (install_archive.stat.size | default(0) | int) == 0
  tags:
    - base
    - start

- name: 清理残留的远端临时目录
  file:
    path: "/data/tmp_create_game{{ area_id }}"
    state: absent
  tags:
    - base
    - start

- name: 创建远端临时目录
  file:
    path: "/data/tmp_create_game{{ area_id }}"
    state: directory
    mode: '0755'
  tags:
    - base
    - start

- name: 解压游戏安装包
  unarchive:
    src: install.tar.gz
    dest: "/data/tmp_create_game{{ area_id }}"
  tags:
    - base
    - start

- name: 清理安装包中的运行时文件
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - "/data/tmp_create_game{{ area_id }}/log"
    - "/data/tmp_create_game{{ area_id }}/lua_lib/config/last_time.db"
    - "/data/tmp_create_game{{ area_id }}/lua_lib/config/last_time.db.gc"
    - "/data/tmp_create_game{{ area_id }}/lua_lib/config/last_time.db.map"
  tags:
    - base
    - start

- name: 创建配置和日志目录
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "/data/tmp_create_game{{ area_id }}/etc"
    - "/data/tmp_create_game{{ area_id }}/lua_lib/config"
    - "/data/tmp_create_game{{ area_id }}/log"
  tags:
    - base
    - start

- name: 生成游戏主配置
  template:
    src: server.app.lua.j2
    dest: "/data/tmp_create_game{{ area_id }}/etc/server.app.lua"
    mode: '0600'
  no_log: true
  tags:
    - base
    - start

- name: 生成区服配置
  template:
    src: zones.lua.j2
    dest: "/data/tmp_create_game{{ area_id }}/etc/zones.lua"
    mode: '0644'
  tags:
    - base
    - start

- name: 校验 profile.lua 包含开服时间配置
  command:
    argv:
      - grep
      - -Eq
      - "^local open_server_time[[:space:]]*="
      - "/data/tmp_create_game{{ area_id }}/lua_lib/config/profile.lua"
  changed_when: false
  tags:
    - base
    - start

- name: 仅修改 profile.lua 开服时间
  lineinfile:
    path: "/data/tmp_create_game{{ area_id }}/lua_lib/config/profile.lua"
    regexp: "^local open_server_time[[:space:]]*="
    line: 'local open_server_time = "{{ open_time }}"'
    state: present
  tags:
    - base
    - start

- name: 设置游戏主程序执行权限
  file:
    path: "/data/tmp_create_game{{ area_id }}/{{ app_binary }}"
    state: file
    mode: '0755'
  tags:
    - base
    - start

- name: 停止已存在的游戏服务
  systemd:
    name: "game{{ area_id }}.service"
    state: stopped
  failed_when: false
  tags:
    - base
    - start

- name: 删除旧游戏目录
  file:
    path: "/data/game{{ area_id }}"
    state: absent
  tags:
    - base
    - start

- name: 部署游戏目录
  command:
    argv:
      - mv
      - "/data/tmp_create_game{{ area_id }}"
      - "/data/game{{ area_id }}"
  tags:
    - base
    - start

- name: 安装 systemd 服务单元
  template:
    src: game.service.j2
    dest: "/etc/systemd/system/game{{ area_id }}.service"
    mode: '0644'
  notify: reload systemd
  tags:
    - base
    - start

- name: 立即重载 systemd
  meta: flush_handlers
  tags:
    - base
    - start

- name: 启用游戏服务
  systemd:
    name: "game{{ area_id }}.service"
    enabled: true
  tags:
    - base
    - start

- name: 启动游戏服务
  systemd:
    name: "game{{ area_id }}.service"
    state: started
  tags:
    - start

- name: 等待游戏服务进入运行状态
  command: "systemctl is-active game{{ area_id }}.service"
  register: game_service_status
  changed_when: false
  retries: 10
  delay: 2
  until: game_service_status.stdout == "active"
  tags:
    - start
