- name: 校验安装包存在且非空
  stat:
    path: "{{ role_path }}/files/install.tar.gz"
  delegate_to: localhost
  become: false
  register: install_archive
  failed_when: >
    not (install_archive.stat.exists | default(false)) or
    (install_archive.stat.size | default(0) | int) == 0
  tags:
    - base
    - start

- name: 确认目标游戏目录不存在
  stat:
    path: "/data/game{{ area_id }}"
  register: target_game_dir
  changed_when: false
  failed_when: target_game_dir.stat.exists | default(false)
  tags:
    - base
    - start

- name: 创建游戏目录
  file:
    path: "/data/game{{ area_id }}"
    state: directory
    mode: '0755'
  tags:
    - base
    - start

- name: 解压游戏安装包
  unarchive:
    src: install.tar.gz
    dest: "/data/game{{ area_id }}"
  tags:
    - base
    - start

- name: 生成游戏主配置
  template:
    src: server.app.lua.j2
    dest: "/data/game{{ area_id }}/etc/server.app.lua"
    mode: '0600'
  no_log: true
  tags:
    - base
    - start

- name: 生成区服配置
  template:
    src: zones.lua.j2
    dest: "/data/game{{ area_id }}/etc/zones.lua"
    mode: '0644'
  tags:
    - base
    - start

- name: 修改 profile.lua 开服时间
  lineinfile:
    path: "/data/game{{ area_id }}/lua_lib/config/profile.lua"
    regexp: '^local[ \t]+open_server_time[ \t]*='
    line: 'local open_server_time = "{{ open_time }}"'
    state: present
  tags:
    - base
    - start

- name: 设置游戏主程序执行权限
  file:
    path: "/data/game{{ area_id }}/{{ app_binary }}"
    state: file
    mode: '0755'
  tags:
    - base
    - start

- name: 安装 systemd 服务单元
  template:
    src: game.service.j2
    dest: "/etc/systemd/system/game{{ area_id }}.service"
    mode: '0644'
  notify: reload systemd
  tags:
    - base
    - start

- name: 立即重载 systemd
  meta: flush_handlers
  tags:
    - base
    - start

- name: 启用游戏服务
  systemd:
    name: "game{{ area_id }}.service"
    enabled: true
  tags:
    - base
    - start

- name: 启动游戏服务
  systemd:
    name: "game{{ area_id }}.service"
    state: started
  tags:
    - start

- name: 等待游戏服务进入运行状态
  command: "systemctl is-active game{{ area_id }}.service"
  register: game_service_status
  changed_when: false
  retries: 10
  delay: 2
  until: game_service_status.stdout == "active"
  tags:
    - start
