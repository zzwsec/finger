- name: 校验控制机上的安装包存在且非空
  stat:
    path: "{{ role_path }}/files/install.tar.gz"
  delegate_to: localhost
  register: install_archive
  failed_when: >
    not (install_archive.stat.exists | default(false)) or
    (install_archive.stat.size | default(0) | int) == 0
  tags:
    - base
    - start

- name: 检查目标游戏目录
  stat:
    path: "/data/game{{ area_id }}"
  register: target_game_dir
  changed_when: false
  failed_when: target_game_dir.stat.exists | default(false)
  tags:
    - base
    - start

- name: 检查目标 systemd unit
  command:
    argv:
      - systemctl
      - show
      - --property=LoadState
      - --value
      - "game{{ area_id }}.service"
  register: target_game_unit
  changed_when: false
  failed_when: >
    target_game_unit.rc != 0 or
    (target_game_unit.stdout | trim) != 'not-found'
  tags:
    - base
    - start

- name: 创建游戏目录
  file:
    path: "/data/game{{ area_id }}"
    state: directory
    mode: '0755'
  tags:
    - base
    - start

- name: 解压 P8 游戏安装包
  unarchive:
    src: install.tar.gz
    dest: "/data/game{{ area_id }}"
  tags:
    - base
    - start

- name: 删除继承自源实例的运行状态
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - "/data/game{{ area_id }}/lua/config/open_time.lua"
    - "/data/game{{ area_id }}/lua/config/last_time.db"
    - "/data/game{{ area_id }}/lua/config/last_time.db.gc"
    - "/data/game{{ area_id }}/lua/config/last_time.db.map"
  tags:
    - base
    - start

- name: 生成游戏主配置
  template:
    src: server.app.lua.j2
    dest: "/data/game{{ area_id }}/etc/server.app.lua"
    mode: '0644'
  no_log: true
  tags:
    - base
    - start

- name: 生成区服配置
  template:
    src: zones.lua.j2
    dest: "/data/game{{ area_id }}/etc/zones.lua"
    mode: '0644'
  tags:
    - base
    - start

- name: 生成开服时间配置
  template:
    src: open_time.lua.j2
    dest: "/data/game{{ area_id }}/lua/config/open_time.lua"
    mode: '0644'
  tags:
    - base
    - start

- name: 设置执行权限
  file:
    path: "/data/game{{ area_id }}/{{ app_binary }}"
    state: file
    mode: '0755'
  tags:
    - base
    - start

- name: 安装 P8 systemd 服务单元
  template:
    src: game.service.j2
    dest: "/etc/systemd/system/game{{ area_id }}.service"
    mode: '0644'
  notify: reload systemd
  tags:
    - base
    - start

- name: 立即重载 systemd 配置
  meta: flush_handlers
  tags:
    - base
    - start

- name: 设置游戏服务开机启动
  systemd:
    name: "game{{ area_id }}.service"
    enabled: true
  tags:
    - base
    - start

- name: 启动游戏服务
  systemd:
    name: "game{{ area_id }}.service"
    state: started
  tags:
    - start

- name: 等待游戏服务进入 active
  command:
    argv:
      - systemctl
      - is-active
      - --quiet
      - "game{{ area_id }}.service"
  register: game_service_status
  changed_when: false
  retries: 10
  delay: 2
  until: game_service_status.rc == 0
  tags:
    - start