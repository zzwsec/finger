- name: 校验源游戏目录
  stat:
    path: "/data/game{{ area_id }}"
  register: source_game_dir
  failed_when: >
    not (source_game_dir.stat.exists | default(false)) or
    not (source_game_dir.stat.isdir | default(false))

- name: 校验源游戏文件
  stat:
    path: "/data/game{{ area_id }}/{{ item }}"
  loop:
    - "{{ app_binary | default('p8_app_server') }}"
    - proto
    - etc
    - lua
  register: source_game_files
  failed_when: not (source_game_files.stat.exists | default(false))

- name: 在 /data 下创建临时安装包
  tempfile:
    state: file
    path: /data
    prefix: .p8-install-
    suffix: .tar.gz
  register: remote_archive

- name: 使用 gzip 打包 P8 游戏文件
  archive:
    path:
      - "/data/game{{ area_id }}/{{ app_binary | default('p8_app_server') }}"
      - "/data/game{{ area_id }}/proto"
      - "/data/game{{ area_id }}/etc"
      - "/data/game{{ area_id }}/lua"
    dest: "{{ remote_archive.path }}"
    format: gz
    mode: '0600'

- name: 获取安装包到控制机
  fetch:
    src: "{{ remote_archive.path }}"
    dest: "{{ playbook_dir }}/roles/game/files/install.tar.gz"
    flat: true

- name: 删除远端遗留安装包
  file:
    path: "{{ remote_archive.path }}"
    state: absent
