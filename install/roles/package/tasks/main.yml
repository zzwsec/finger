- name: 校验源游戏目录
  stat:
    path: "/data/game{{ area_id }}"
  register: source_game_dir
  failed_when: >
    not (source_game_dir.stat.exists | default(false)) or
    not (source_game_dir.stat.isdir | default(false))

- name: 创建远端打包目录
  file:
    path: /data/update
    state: directory
    mode: '0755'

- name: 打包 P9 游戏文件
  archive:
    format: gz
    path:
      - "/data/game{{ area_id }}/{{ app_binary | default('p9_app_server') }}"
      - "/data/game{{ area_id }}/proto"
      - "/data/game{{ area_id }}/etc"
      - "/data/game{{ area_id }}/lua_lib"
    dest: /data/update/install.tar.gz
    owner: ubuntu
    mode: '0600'

- name: 获取安装包到控制机
  fetch:
    src: /data/update/install.tar.gz
    dest: "{{ playbook_dir }}/roles/game/files/install.tar.gz"
    flat: true
  become: false
